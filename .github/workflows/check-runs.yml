name: check-runs

on:
  push:
    branches: [status-spike]

permissions:
  checks: write

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      VRT_BUILD_URL: https://vrt.example.com/projects/vrt-test/builds/42
    steps:
      - name: Check run that stays in_progress
        run: |
          gh api "repos/$REPO/check-runs" \
            -f name="check-run-in-progress" \
            -f head_sha="$SHA" \
            -f status="in_progress" \
            -f details_url="$VRT_BUILD_URL" \
            -f "output[title]=18 differences waiting for approval in VRT" \
            -f "output[summary]=Check run with status in_progress." \
            --jq '{name, status, details_url}'

      - name: Check run with conclusion action_required
        run: |
          gh api "repos/$REPO/check-runs" \
            -f name="check-run-action-required" \
            -f head_sha="$SHA" \
            -f status="completed" \
            -f conclusion="action_required" \
            -f details_url="$VRT_BUILD_URL" \
            -f "output[title]=18 differences waiting for approval in VRT" \
            -f "output[summary]=Review the differences in the [VRT build]($VRT_BUILD_URL). This check turns green by itself once every difference is approved." \
            -f "actions[][label]=Open in VRT" \
            -f "actions[][description]=Open the VRT build" \
            -f "actions[][identifier]=open_vrt" \
            --jq '{name, conclusion, details_url}'
